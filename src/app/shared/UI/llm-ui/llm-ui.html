<div id="chatbot" class="max-w-2xl mx-auto space-y-4">
  <!-- Response display -->
  @if (response()) {
    <div class="glass-panel p-4 rounded-xl">
      <p class="text-sm text-on-surface whitespace-pre-wrap">{{ response() }}</p>
    </div>
  }

  <!-- Input area -->
  <div class="glass-panel flex items-center gap-2 p-2 rounded-xl">
    <input
      class="flex-grow bg-transparent border-none focus:ring-0 text-sm text-on-surface placeholder:text-on-surface-variant/50 px-4"
      [placeholder]="isModelLoading() ? 'Loading model...' : 'Send instructions to the LLM...'"
      type="text"
      [value]="inputText()"
      (input)="inputText.set($any($event.target).value)"
      (keyup.enter)="handleGenerate()"
      [disabled]="isGenerating() || isModelLoading()"
    />
    <button
      class="w-10 h-10 flex items-center justify-center bg-primary text-on-primary rounded-lg active:opacity-80 transition-opacity disabled:opacity-50"
      (click)="handleGenerate()"
      [disabled]="isGenerating() || isModelLoading()"
    >
      @if (isModelLoading()) {
        <span class="material-symbols-outlined animate-spin">progress_activity</span>
      } @else if (isGenerating()) {
        <span class="material-symbols-outlined animate-spin">progress_activity</span>
      } @else {
        <span
          class="material-symbols-outlined"
          data-icon="send"
          style="font-variation-settings: 'FILL' 1"
          >send</span
        >
      }
    </button>
  </div>
</div>
